[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = laradock
group = laradock
listen = 0.0.0.0:9000
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 0
; Stack sampling via ptrace is unavailable under Docker Desktop amd64 emulation.
request_slowlog_timeout = 0
slowlog = /proc/self/fd/2
ping.path = /phping
ping.response = ok
